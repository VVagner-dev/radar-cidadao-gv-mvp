spring:
  application:
    name: radarcidadaogv
  datasource:
    url: jdbc:h2:file:./data/radar-cidadao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB

app:
  uploads-directory: ./uploads
  groq:
    api-key: ${GROQ_API_KEY:}
    model: qwen/qwen3.8-27b
